services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      BACKEND_PORT: 3001
      # SQLite em volume persistente (backend atual usa better-sqlite3, não postgres)
      DATABASE_PATH: /data/torre-rpa.db
      SCRIPTS_DIR: /app/scripts
      EXECUTION_TIMEOUT_MS: 1800000
      # Obrigatório — sem fallback. Gere com: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório — defina no .env}
      OPENPORT_MOCK: ${OPENPORT_MOCK:-false}
      OPENPORT_API_URL: ${OPENPORT_API_URL:-}
    volumes:
      - torre-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  torre-data:
